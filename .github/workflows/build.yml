name: Build XMAPort

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tools/**'
      - 'config.ini'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      device:
        description: '目标设备代号 (e.g. sheng, fuxi, cupid, mondrian)'
        required: true
        type: string
      source:
        description: '源 ROM 直链（留空用 config.ini）'
        required: false
        type: string
      target:
        description: '目标 ROM 直链（留空用 config.ini）'
        required: false
        type: string

jobs:
  porting:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run XMAPort
        shell: pwsh
        run: |
          $args = @("--auto", "--device", "${{ inputs.device }}")
          if ("${{ inputs.source }}") { $args += "--source"; $args += "${{ inputs.source }}" }
          if ("${{ inputs.target }}") { $args += "--target"; $args += "${{ inputs.target }}" }
          python XMAPort.py @args

      - name: Compress and split super.img
        shell: pwsh
        run: |
          if (-not (Test-Path workspace\packed\super.img)) { Write-Error "super.img not found"; exit 1 }
          .\tools\7z.exe a -t7z -mx=5 -v1900m workspace\super-${{ inputs.device }}.7z workspace\packed\super.img
          if ($LASTEXITCODE -ne 0) { Write-Error "7z failed (exit $LASTEXITCODE)"; exit 1 }

      - name: Upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $date = Get-Date -Format "MMdd"
          $n = 1
          $prefix = "XMAPort-Output-${{ inputs.device }}-$date"
          while (gh release view "$prefix-$n" 2>$null) { $n++ }
          $tag = "$prefix-$n"

          $volFiles = @(Get-ChildItem "workspace\super-${{ inputs.device }}.7z.*" | ForEach-Object { $_.FullName })
          if (-not $volFiles) { Write-Error "no split volumes found"; exit 1 }
          $logFiles = @(Get-ChildItem "workspace\*.log" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          $allFiles = $volFiles + $logFiles

          $romInfo = @("ROM Info:")
          if (Test-Path workspace\rom_info.txt) {
            $romInfo += Get-Content workspace\rom_info.txt -Encoding UTF8 | Where-Object { $_ -match '^\S+:\s*\S+' }
          } else {
            $romInfo += "device: ${{ inputs.device }}"
          }
          $notes = "移植输出（分卷 7z，每卷 <=2GB）。`n`n" + ($romInfo -join "`n") + "`n`n合并解压：`n7z x super-${{ inputs.device }}.7z.001"

          gh release create $tag $allFiles --title "XMAPort ${{ inputs.device }} $date #$n" --notes $notes --latest

  build:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item XMAPort.py release\
          Copy-Item -Recurse tools release\
          Copy-Item config.ini release\
          Remove-Item -Recurse -Force release\tools\jre\legal
          Compress-Archive -Path release\* -DestinationPath XMAPort-win64.zip

      - name: Upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $date = Get-Date -Format "yyyyMMdd"
          $n = 1
          $tag = "XMAPort-${date}-Beta-$n"
          while (gh release view $tag 2>$null) { $n++; $tag = "XMAPort-${date}-Beta-$n" }
          gh release create $tag XMAPort-win64.zip --title "XMAPort ${date} Beta" --notes "自动构建的 Windows 版本（Python 源码包，需安装 Python 3）。`n`n用法：解压后运行 python XMAPort.py（或使用命令行参数 --auto/--device/--source/--target）。" --latest
