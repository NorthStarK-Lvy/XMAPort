name: Build XMAPort

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tools/**'
      - 'config.ini'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      device:
        description: '目标设备代号 (e.g. sheng, fuxi, cupid, mondrian)'
        required: true
        type: string
      source:
        description: '源 ROM 直链（留空用 config.ini）'
        required: false
        type: string
      target:
        description: '目标 ROM 直链（留空用 config.ini）'
        required: false
        type: string

jobs:
  porting:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run XMAPort
        shell: pwsh
        run: |
          $args = @("--auto", "--device", "${{ inputs.device }}")
          if ("${{ inputs.source }}") { $args += "--source"; $args += "${{ inputs.source }}" }
          if ("${{ inputs.target }}") { $args += "--target"; $args += "${{ inputs.target }}" }
          python XMAPort.py @args

      - name: Upload porting output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XMAPort-output-${{ inputs.device }}
          path: |
            workspace/packed/*.img
            workspace/*.log
          if-no-files-found: warn
          retention-days: 7

  build:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item XMAPort.py release\
          Copy-Item -Recurse tools release\
          Copy-Item config.ini release\
          Compress-Archive -Path release\* -DestinationPath XMAPort-win64.zip

      - name: Upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $date = Get-Date -Format yyyyMMdd
          $base = "XMAPort-$date-Beta"

          # 统计今天已有的 release 数量，决定这是今天的第几个版本
          $todayTags = gh release list --limit 100 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -like "$base*" }
          $count = @($todayTags).Count + 1

          if ($count -eq 1) {
            $tag = $base
          } else {
            $tag = "$base-$count"
          }

          $notes = "XMAPort $date Beta On Windows（今日第 $count 个版本）" +
            "`n`n用法：解压后运行 XMAPort.py（或使用命令行参数 --auto/--device/--source/--target）。"

          gh release create $tag XMAPort-win64.zip --title "XMAPort $date Beta #$count" --notes $notes --latest
