name: Build XMAPort Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      device:
        description: '目标设备代号 (e.g. sheng, fuxi, cupid)'
        required: true
        type: string
      source:
        description: '源 ROM 直链（留空用 config.ini）'
        required: false
        type: string
      target:
        description: '目标 ROM 直链（留空用 config.ini）'
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip && pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --console --name XMAPort XMAPort.py

      - name: Run XMAPort (--auto)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $cmd = "python XMAPort.py --auto -y --device ${{ inputs.device }}"
          if ("${{ inputs.source }}" -ne "") {
            $cmd += " --source `"${{ inputs.source }}`""
          }
          if ("${{ inputs.target }}" -ne "") {
            $cmd += " --target `"${{ inputs.target }}`""
          }
          Invoke-Expression $cmd

      - name: Upload porting output
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/upload-artifact@v4
        with:
          name: XMAPort-output-${{ inputs.device }}
          path: workspace/packed/*.img
          if-no-files-found: ignore

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist\XMAPort.exe release\
          Copy-Item -Recurse tools release\
          Copy-Item config.ini release\
          Compress-Archive -Path release\* -DestinationPath XMAPort-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMAPort-win64
          path: XMAPort-win64.zip

