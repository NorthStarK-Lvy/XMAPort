name: Build XMAPort

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tools/**'
      - 'config.ini'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      device:
        description: '目标设备代号 (e.g. sheng, fuxi, cupid, mondrian)'
        required: true
        type: string
      source:
        description: '源 ROM 直链（留空用 config.ini）'
        required: false
        type: string
      target:
        description: '目标 ROM 直链（留空用 config.ini）'
        required: false
        type: string
      yes:
        description: '跳过确认 (true/false)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  porting:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Run XMAPort
        shell: pwsh
        run: |
          $args = @("--auto", "--device", "${{ inputs.device }}")
          if ("${{ inputs.source }}") { $args += "--source"; $args += "${{ inputs.source }}" }
          if ("${{ inputs.target }}") { $args += "--target"; $args += "${{ inputs.target }}" }
          if ("${{ inputs.yes }}" -eq "true") { $args += "-y" }
          python XMAPort.py @args

      - name: Upload porting output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XMAPort-output-${{ inputs.device }}
          path: |
            workspace/packed/*.img
            workspace/*.log
          if-no-files-found: warn
          retention-days: 7

  build:
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --console --name XMAPort XMAPort.py

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist\XMAPort.exe release\
          Copy-Item -Recurse tools release\
          Copy-Item config.ini release\
          Compress-Archive -Path release\* -DestinationPath XMAPort-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMAPort-win64
          path: XMAPort-win64.zip
