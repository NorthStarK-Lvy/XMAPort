name: Build XMAPort

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tools/**'
      - 'config.ini'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      device:
        description: '目标设备代号 (e.g. sheng, fuxi, cupid, mondrian)'
        required: true
        type: string
      source:
        description: '源 ROM 直链（留空用 config.ini）'
        required: false
        type: string
      target:
        description: '目标 ROM 直链（留空用 config.ini）'
        required: false
        type: string

jobs:
  porting:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run XMAPort
        shell: pwsh
        run: |
          $args = @("--auto", "--device", "${{ inputs.device }}")
          if ("${{ inputs.source }}") { $args += "--source"; $args += "${{ inputs.source }}" }
          if ("${{ inputs.target }}") { $args += "--target"; $args += "${{ inputs.target }}" }
          python XMAPort.py @args

      - name: Compress and split super.img
        shell: pwsh
        run: |
          if (-not (Test-Path workspace\packed\super.img)) { Write-Error "super.img not found"; exit 1 }
          .\tools\7z.exe a -t7z -mx=5 -v1900m workspace\super-${{ inputs.device }}.7z workspace\packed\super.img
          if ($LASTEXITCODE -ne 0) { Write-Error "7z failed (exit $LASTEXITCODE)"; exit 1 }

      - name: Upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "XMAPort-Output-${{ inputs.device }}-$(Get-Date -Format yyyyMMdd)"
          $files = @(Get-ChildItem "workspace\super-${{ inputs.device }}.7z.*" | ForEach-Object { $_.FullName })
          if (-not $files) { Write-Error "no split volumes found"; exit 1 }
          if (gh release view $tag 2>$null) {
            gh release upload $tag $files --clobber
            gh release edit $tag --latest
          } else {
            gh release create $tag $files --title "XMAPort ${{ inputs.device }} $(Get-Date -Format yyyyMMdd)" --notes "移植输出（分卷 7z，每卷 <=2GB）。`n`n合并解压：`n7z x super-${{ inputs.device }}.7z.001" --latest
          }
          $logFiles = @(Get-ChildItem "workspace\*.log" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          if ($logFiles) { gh release upload $tag $logFiles --clobber }

  build:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item XMAPort.py release\
          Copy-Item -Recurse tools release\
          Copy-Item config.ini release\
          Remove-Item -Recurse -Force release\tools\jre\legal
          Compress-Archive -Path release\* -DestinationPath XMAPort-win64.zip

      - name: Upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "XMAPort-$(Get-Date -Format yyyyMMdd)-Beta"
          if (gh release view $tag 2>$null) {
            gh release upload $tag XMAPort-win64.zip --clobber
            gh release edit $tag --latest
          } else {
            gh release create $tag XMAPort-win64.zip --title "XMAPort $(Get-Date -Format yyyyMMdd) Beta" --notes "自动构建的 Windows 版本。`n`n用法：解压后运行 XMAPort.exe（或使用命令行参数 --auto/--device/--source/--target）。" --latest
          }
