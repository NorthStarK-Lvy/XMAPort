; 填写直接下载地址(请不要以ultimateota开头)
; 示例: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.307.0.WPUCNXM/user-16.0-b9de94fb03.zip
url=https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.5.0.VMRCNXM/marble-ota_full-OS3.0.5.0.VMRCNXM-user-15.0-727afd7728.zip


[target]
; target = 目标手机，需要移植到的机型的原厂ROM
; 填写直接下载地址(请不要以ultimateota开头)
; 示例: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.307.0.WPUCNXM/user-16.0-b9de94fb03.zip
url=https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.2.0.VMWCNXM/sky-ota_full-OS2.0.2.0.VMWCNXM-user-15.0-eeb8a4da80.zip

[settings]
; 下载线程数，默认16
threads=16

; 每个服务器最大连接数，默认16
max-connection=16

; 下载超时时间（秒），默认300
timeout=300

; 下载失败重试次数，默认5
retry=5

[packing]
; 是否打包生成super.img，默认false（false可以跳过）
pack_super=true

; 打包文件系统格式: erofs 或 ext4，默认erofs
format=erofs

; 是否只读挂载，默认true
readonly=true

; 压缩格式：lz4hc / lz4 / zstd / lzma / deflate，默认lz4hc（仅erofs用）
compression=lz4hc

; 压缩等级 0-9，只对erofs有效，越大越小越费时间，默认8
compression_level=8

; super分区总大小（字节），用lpdumps.exe查看原super.img获得，默认6979321856（6.5GB）
device_size=6979321856

; 元数据大小（字节），默认65536（64KB）
metadata_size=65536

; 是否输出sparse格式，默认true
sparse=true

; super块设备名，一般不需要改，默认super
super_name=super

; super分区组名，用lpdumps.exe查看原super.img的group名，默认qti_dynamic_partitions
super_group=qti_dynamic_partitions

; 以下内容不建议使用者修改，强烈建议保持默认！
; 以下内容不建议使用者修改，强烈建议保持默认！
; 以下内容不建议使用者修改，强烈建议保持默认！

; 元数据槽位数: 2=A-only，3=AB/虚拟AB，默认3
metadata_slots=3

; 是否虚拟AB分区，默认true（小米新机型都是vAB）
virtual_ab=true

; ext4打包工具: make_ext4fs 或 mke2fs（仅format=ext4时用），默认make_ext4fs
ext4_packer=make_ext4fs

; 是否跳过 system_ext 重打包
is_skip_apex=true

; 是否注入 adb debug 属性（开 adb 调试），刷入后 adb 免授权可用，默认 false
enable_adb_debug=true

; 是否禁验 vbmeta（disable-verity + disable-verification），刷第三方 ROM 建议 true，默认 true
patch_vbmeta=true

; 固定 UTC 时间戳（整数，留空 = 当前时间，用于可复现打包）
utc_stamp=

; erofs 是否启用旧内核兼容（-E legacy-compress），默认 false
erofs_old_kernel=false

; erofs工具是否使用旧版（tools/erofs-utils-cygwin/erofs-utils 1.4），默认 false 使用新版
IF_LEGACY_EROFS=false

; patch build prop list
####################################
# from device/xiaomi/mivendor/common_rw.prop
####################################
# For common rw override property
#support night charge property
persist.vendor.night.charge=true
####################################
# from device/xiaomi/zero/odm/special_rw.prop
####################################
#support accelerate charge property
persist.vendor.accelerate.charge=true
#support battery health
persist.vendor.battery.health=true
persist.vendor.battery.health.optimise=true
#enable extreme battery
persist.vendor.extreme.mode=true
#support high temp dialog
persist.vendor.hightemp.notice=true
#support smart charge engine
persist.vendor.smartchg=6
#camera wechat beauty
persist.vendor.vcb.ability=true
persist.vendor.vcb.enable=false
ro.vendor.cabc.enable=fasle
ro.vendor.bcbc.enable=true
ro.vendor.dfps.enable=false
ro.vendor.fps.switch.default=true
ro.vendor.gcp.enable=1
ro.vendor.display.default_fps=90
ro.vendor.sre.enable=true
ro.vendor.localhbm.enable=true
ro.vendor.video_box.version=2
