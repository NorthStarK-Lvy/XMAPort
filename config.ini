; ============================================
; XMAPort 配置文件
; 改完保存请保持 ANSI/GBK 编码，程序按 GBK 读取
; ============================================

; 目标设备平台：Qualcomm / MTK，必须按真实设备如实填写
; 填错会走错 vendor 处理分支（MTK 重打包 / 高通直复制），可能无法开机
device_platform=Qualcomm

[source]
; 源 ROM（要移植出去的系统）官方完整卡刷包直链 zip
; 只能填直链，不能 fastboot 包、不能 ultimateota 开头的链接
; 留空 = 不下载，优先使用 workspace/download_source 中的本地包；本地包只能有一个，没有包才复用工作区镜像
url=https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.0.15.XPACNXM/nezha-ota_full-OS4.0.0.15.XPACNXM-user-17.0-87b65524dc.zip

[target]
; 底包 ROM（目标设备的官方完整卡刷包）直链 zip，提供 odm / vendor 等分区
; 留空 = 不下载，优先使用 workspace/download_target 中的本地包；本地包只能有一个，没有包才复用工作区镜像
url=https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.204.0.VMWCNXM/sky-ota_full-OS2.0.204.0.VMWCNXM-user-15.0-5b8f723fe7.zip

[settings]
; 下载设置（aria2c）
; 下载分块线程数（aria2 -s）
threads=16

; 单服务器最大连接数（aria2 -x）
; 官方 aria2 硬上限 16，填再大也会被 aria2 拒绝或忽略
max-connection=16

; 连接超时秒数
timeout=300

; 下载失败后的整体重试次数（0 = 只下载一次，不重试）
retry=5

[packing]
; ============================================
; 镜像打包
; ============================================
; 分区文件系统：erofs / ext4，必须与源 ROM 实际格式一致
format=erofs

; 是否在打包后自动合成 super.img
; false 时可用主菜单 [A] 命令执行器 -> 1 单独合成
pack_super=false

; 是否生成 sparse 格式镜像（线刷一般要 true）
sparse=true

; 镜像内文件的时间戳；留空 = 自动用当前 UTC 时间
utc_stamp=

; erofs 压缩算法与级别（常用 lz4hc + 8；级别越高越小越慢）
compression=lz4hc
compression_level=8

; true = 启用旧内核兼容布局（mkfs.erofs -E legacy-compress）
; 仅老内核设备需要，新设备保持 false
erofs_old_kernel=false

; ============================================
; super 分区参数 —— 按目标设备真实参数填写，填错可能无法开机
; ============================================
; super 分区分配总大小（字节），示例为 6.5GB
device_size=6979321856

; metadata 分区大小（字节）
metadata_size=65536

; metadata 插槽数（A/B 设备一般 3）
metadata_slots=3

; 是否启用 Virtual A/B
virtual_ab=true

; super 分区名
super_name=super

; 动态分区组名：高通一般 qti_dynamic_partitions，MTK 一般 main
super_group=qti_dynamic_partitions

; ============================================
; 移植开关
; ============================================
; true  = 跳过 system_ext 重打包，直接复制源镜像（快；APEX 同步过会自动换旧版工具打包）
; false = 重新打包 system_ext（慢，但同步 APEX 后内容更完整）
is_skip_apex=false

; true = 向 odm build.prop 注入 adb/root 调试属性（ro.secure=0 等）
; 仅调试用途，日常使用的包建议关掉
enable_adb_debug=true

; true = 修改 vbmeta 关闭 AVB 校验（刷移植包通常需要）
patch_vbmeta=true

; ============================================
; Build Prop Patch List —— 此标记行以下的 prop 会追加到目标 odm/etc/build.prop
; 可以自行增删 prop 行（从标记行到下一个 [section] 之间全部生效）
; 自行添加不保证开机
; ============================================
; patch build prop list
####################################
# from device/xiaomi/mivendor/common_rw.prop
####################################
# For common rw override property
#support night charge property
persist.vendor.night.charge=true
####################################
# from device/xiaomi/zero/odm/special_rw.prop
####################################
#support accelerate charge property
persist.vendor.accelerate.charge=true
#support battery health
persist.vendor.battery.health=true
#enable extreme battery
persist.vendor.extreme.mode=true
#support high temp dialog
persist.vendor.hightemp.notice=true
#support smart charge engine
persist.vendor.smartchg=854
#camera wechat beauty
persist.vendor.vcb.ability=true
persist.vendor.vcb.enable=false
ro.vendor.cabc.enable=false
ro.vendor.bcbc.enable=true
ro.vendor.dfps.enable=false
ro.vendor.fps.switch.default=true
ro.vendor.gcp.enable=1
ro.vendor.display.default_fps=90
ro.vendor.sre.enable=true
ro.vendor.localhbm.enable=true
ro.vendor.video_box.version=2
